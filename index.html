<!doctype html>
<html lang="en" data-theme="light" data-palette="clay" data-art="cover">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ruiqi Shu studies machine learning for the physical world, dynamical systems, differentiable numerical solvers, and hybrid physics-learning models at Tsinghua University."
    />
    <meta name="theme-color" content="#fcfaf7" />
    <title>Ruiqi Shu | Learning the Physical World</title>
    <script>
      (() => {
        let theme = new URLSearchParams(location.search).get("theme");
        if (theme !== "light" && theme !== "dark") {
          try {
            theme = localStorage.getItem("academic-theme");
          } catch {
            /* Storage is optional. */
          }
        }
        document.documentElement.dataset.theme =
          theme === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
